[project]
name = "fia-doc-explainer"
version = "0.1.0"
description = "Official FIA doc in - clear and simple expanation out"
readme = "README.md"
authors = [
    { name = "Oleksii_Leshchenko", email = "leshchenko.o91@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
fia-doc-explainer = "fia_doc_explainer.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
